{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Peak{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-warning shadow-sm">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand text-dark fw-bold fs-3" href="{% url 'index' %}">
            Peak
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto gap-lg-3">

                <li class="nav-item">
                    <a class="nav-link text-dark fw-semibold"
                       href="{% url 'index' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-dark fw-semibold"
                       href="{% url 'about' %}">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-dark fw-semibold"
                       href="{% url 'login' %}">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-dark fw-semibold"
                       href="{% url 'signup' %}">Sign Up</a>
                </li>
                <li class="nav-item">
                <a href="{% url 'cart' %}" class="nav-link">
              <i class="bi bi-cart"></i> Cart
              </a>
            </li>

            </ul>
        </div>

    </div>
</nav>


<main class="container mt-4">
    {% block content %}{% endblock %}
</main>

{% include 'footer.html' %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
